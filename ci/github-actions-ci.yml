# GitHub Actions CI workflow template for NMS-Network-Management-System-.
# Place at .github/workflows/ci.yml using a PAT with the `workflow` scope or via GitHub UI.
name: NMS CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install host prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y openssl socat zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Provision OpenWrt 25.12.6 host apk-tools (mkpkg/mkndx)
        run: |
          mkdir -p /tmp/openwrt-sdk
          curl -fsSL https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst \
            | tar --zstd -xf - --strip-components=1 -C /tmp/openwrt-sdk --wildcards '*/staging_dir/host/bin/apk' '*/staging_dir/host/bin/.apk.bin' '*/staging_dir/host/lib/*'
          echo "APK_BIN=/tmp/openwrt-sdk/staging_dir/host/bin/apk" >> "$GITHUB_ENV"
          /tmp/openwrt-sdk/staging_dir/host/bin/apk --version

      - name: Provision isolated OpenWrt 24.10.0 & 25.12.6 chroots
        run: sh scripts/provision_ci_chroots.sh

      - name: Run full NMS CI verification (fails on any failure or skipped test)
        run: sh scripts/run_ci_local.sh
